name: Publish to Comfy Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ZURAVFX/ComfyUI_zura_nodes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version and package assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          from pathlib import Path
          import tomllib
          metadata = tomllib.loads(Path('pyproject.toml').read_text())
          version = metadata['project']['version']
          tag = os.environ.get('RELEASE_TAG', '')
          if tag and tag != f'v{version}':
              raise SystemExit(f'Release tag {tag} must match v{version} in pyproject.toml')
          assert metadata['tool']['comfy']['PublisherId'] == 'zuravfx'
          assert metadata['project']['name'] == 'comfyui-zura-nodes'
          tree = ast.parse(Path('__init__.py').read_text(encoding='utf-8'))
          module_version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          assert version == module_version, 'Update __version__ as well as pyproject.toml'
          template_version = tomllib.loads(Path('pyproject.toml.template').read_text())['project']['version']
          assert version == template_version, 'Keep the package template version in sync'
          assert Path('LICENSE').is_file()
          assert Path('THIRD_PARTY_NOTICES.md').is_file()
          assert Path('web/v2_media_picker.js').is_file()
          studio_loader = Path('web/studio.js').read_text(encoding='utf-8')
          for asset in ('web/studio_create.js', 'web/studio_create.css',
                        'web/studio_composer.js', 'web/studio_composer.css',
                        'web/studio_frames.js', 'web/frame_video_recipes.js',
                        'web/video_recipe_catalog.js', 'web/wan_frame_video_recipes.js',
                        'web/ltx_frame_video_recipes.js', 'web/reference_video_recipes.js',
                        'web/studio_references.js', 'web/studio_popovers.js',
                        'web/studio_live_preview.js', 'artist_studio/live_preview.py',
                        'artist_studio/opening_subject.py',
                        'web/image_recipes.js',
                        'web/studio_components.css',
                        'web/vendor/studio-components.css',
                        'web/vendor/studio-components.js',
                        'web/vendor/studio-components.js.LEGAL.txt',
                        'licenses/daisyui-LICENSE.txt',
                        'licenses/tailwindcss-LICENSE.txt',
                        'licenses/webawesome-LICENSE.md'):
              assert Path(asset).is_file(), f'Missing Studio component release asset: {asset}'
          for import_path in ('./studio_create.js', './studio_create.css',
                              './studio_components.css', './vendor/studio-components.css',
                              './vendor/studio-components.js'):
              assert import_path in studio_loader, f'Studio does not load packaged UI asset: {import_path}'
          for asset in ('web/multicam_angle_gallery.js', 'web/anyangle_english.js', 'multicam_v3.py',
                        'multicam_v4_clean.py', 'h3_single_angle.py',
                        'idv2v_control.py', 'klein_look.py'):
              assert Path(asset).is_file(), f'Missing multicam release asset: {asset}'
          for asset in ('wan_artist.py', 'web/studio.js', 'web/studio.css', 'web/studio_trim.js',
                        'artist_studio/__init__.py', 'artist_studio/studio.py',
                        'artist_studio/h3.py', 'artist_studio/wan.py', 'artist_studio/wan_speech.py',
                        'artist_studio/mask_selection.py', 'artist_studio/text_removal.py',
                        'artist_studio/enhancement.py',
                        'artist_studio/speech.py', 'artist_studio/speech_latentsync.py',
                        'artist_studio/latentsync_vendor/NOTICE.md',
                        'artist_studio/latentsync_vendor/LICENSE-LatentSync',
                        'artist_studio/latentsync_vendor/LICENSE-Whisper',
                        'artist_studio/latentsync_vendor/mask.png',
                        'artist_studio/latentsync_vendor/unet_config.json',
                        'artist_studio/latentsync_vendor/scheduler_config.json',
                        'artist_studio/latentsync_vendor/models/unet.py',
                        'artist_studio/latentsync_vendor/models/unet_blocks.py',
                        'artist_studio/latentsync_vendor/models/attention.py',
                        'artist_studio/latentsync_vendor/models/motion_module.py',
                        'artist_studio/latentsync_vendor/models/resnet.py',
                        'artist_studio/latentsync_vendor/models/utils.py',
                        'artist_studio/latentsync_vendor/audio/encoder.py',
                        'artist_studio/latentsync_vendor/audio/mel.py',
                        'artist_studio/latentsync_vendor/audio/assets/mel_filters.npz',
                        'artist_studio/voice.py', 'artist_studio/signals.py',
                        'web/artist_graph.js', 'web/graph_routing.js', 'web/vendor/elk.bundled.js', 'web/vendor/ELK-LICENSE.md',
                        'setup_speech.py', 'Setup_Speech_Windows.cmd',
                        'setup_wan_speech.py', 'Setup_Wan_Speech_Windows.cmd',
                        'setup_h3_enhancement.py', 'Setup_H3_Enhancement_Windows.cmd',
                        'workflows/Image - Build a Starting Frame.json', 'workflows/Image - Build a Starting Frame (3 References).json',
                        'workflows/Image - Use a Finished Starting Frame.json',
                        'ARTIST_STUDIO.md', 'ARTIST_STUDIO_VALIDATION.md', 'Open_Zura_Studio.url'):
              assert Path(asset).is_file(), f'Missing artist studio asset: {asset}'
          for asset in ('artist_studio/ltx25.py', 'artist_studio/opening.py', 'artist_studio/appearance.py', 'artist_studio/hardware.py', 'INSTALL_STUDIO.md',
                        'artist_studio/wan21_relight.py', 'tests/test_wan21_relight.py',
                        'artist_studio/wan_parts.py', 'artist_studio/wan_graph.py', 'artist_studio/wan_graph_guard.py',
                        'artist_studio/h3_windows.py', 'artist_studio/h3_window_nodes.py',
                        'artist_studio/cut_tracking.py', 'wan_preparation_runtime.py',
                        'wan_preparation_parts.py', 'wan_preparation_windows.py', 'wan_preparation_merge.py',
                        'wan_bounded_speech.py', 'streaming_video.py', 'bounded_video_audio.py',
                        'h3_control_data.py', 'h3_reference_data.py', 'video_latent_data.py',
                        'studio_mask_cleanup.py', 'web/wan_graph.js',
                        'tests/test_ltx25_native_plan.py', 'tests/test_ltx25_studio_runtime.py',
                        'tests/test_studio_opening.py', 'tests/test_wan_bounded_guard.py',
                        'tests/test_wan_parts_graph.py', 'tests/test_wan_preparation_parts.py',
                        'tests/test_wan_preparation_windows.py', 'tests/test_wan_preparation_merge.py',
                        'tests/test_wan_streaming.py', 'tests/test_wan_graph.py',
                        'tests/test_wan_graph_integration.py', 'tests/test_bounded_video_audio.py',
                        'tests/test_h3_control_data.py', 'tests/test_h3_reference_data.py',
                        'tests/test_h3_windows.py', 'tests/test_h3_window_nodes.py',
                        'tests/test_video_latent_data.py', 'tests/test_cut_tracking.py',
                        'tests/test_studio_mask_cleanup.py', 'tests/test_wan_graph.mjs'):
              assert Path(asset).is_file(), f'Missing bounded Studio release asset: {asset}'
          for graph in Path('artist_studio/graphs').glob('*.json'):
              assert json.loads(graph.read_text()), f'Invalid native graph: {graph}'
          for filename in ('Video - Change Camera (H3).json',
                           'Video - Multicam (H3 Advanced).json'):
              text = Path('workflows', filename).read_text(encoding='utf-8')
              workflow = json.loads(text)
              assert workflow.get('nodes') and workflow.get('definitions', {}).get('subgraphs')
              assert 'example_performance.mp4' in text
              assert '2026-09-18' not in text
              assert not any(item in text for item in ('ComfyUI-Shared', 'C:\\\\Users', 'ellio'))
              assert not any(ext in text.lower() for ext in ('data:image/', 'data:video/', 'base64,'))
          workflow = json.loads(Path('workflows/Video - Replace a Character (Wan 2.2).json').read_text())
          expected = {'TrendStudioV2DrivingClip', 'TrendStudioV2MaskPerformer', 'TrendStudioV2Render', 'TrendStudioV2Speed'}
          assert expected <= {n['type'] for n in workflow['nodes']}
          prompt_workflow = json.loads(Path('workflows/Utility - Improve a Prompt (Gemma 4).json').read_text())
          prompt_text = json.dumps(prompt_workflow)
          assert 'example_reference.png' in prompt_text
          assert '00.png' not in prompt_text
          assert not any(ext in prompt_text.lower() for ext in ('data:image/', 'data:video/', 'base64,'))
          for filename, placeholders in {
              'Reference - Mask and Roto (SAM3).json': ('example_source.mp4',),
              'Reference - Head and Face Swap (H3).json': ('example_driving_video.mp4', 'example_character.png'),
              'Reference - Speedboost Comparison (H3).json': ('example_reference.png',),
          }.items():
              text = Path('workflows', filename).read_text(encoding='utf-8')
              assert all(item in text for item in placeholders)
              assert not any(item in text for item in ('ComfyUI-Shared', 'Gurkhas', 'Scouser Starter', 'Codex Image'))
              assert not any(ext in text.lower() for ext in ('data:image/', 'data:video/', 'base64,'))
          for asset in ('longcat.py', 'setup_longcat.py', 'Setup_LongCat_Windows.cmd',
                        'LONGCAT.md', 'longcat_runtime/worker.py',
                        'longcat_runtime/text.py', 'longcat_runtime/requirements.txt'):
              assert Path(asset).is_file(), f'Missing LongCat release asset: {asset}'
          assert not list(Path('.').rglob('longcat.local.json*'))
          for asset in ('audio_dialogue.py', 'audio_parakeet.py', 'dialogue_edit.py',
                        'dialogue_signals.py', 'web/audio_dialogue_editor.js',
                        'web/dialogue_editor.js', 'web/dialogue_transcript.js',
                        'web/dialogue_face_picker.js', 'DIALOGUE_EDITING.md'):
              assert Path(asset).is_file(), f'Missing dialogue editor asset: {asset}'
          assert not list(Path('.').rglob('parakeet.local.json*'))
          for filename in ('Audio - Replace Speech (LongCat).json', 'Video - Replace Speech (LTX INT8).json'):
              text = Path('workflows', filename).read_text(encoding='utf-8')
              graph = json.loads(text)
              assert len(graph['nodes']) == (4 if filename == 'Audio - Replace Speech (LongCat).json' else 3) and graph['definitions']['subgraphs']
              assert not any(item in text for item in ('ComfyUI-Shared', 'C:\\\\Users', 'ellio', 'pound_euro_original', 'zuraAudioPreview', 'zuraDialoguePreview', 'base64,'))
          for asset in ('qwen_voice_design.py', 'setup_voice_design.py', 'VOICE_DESIGN.md',
                        'Setup_Voice_Design_Windows.cmd', 'voice_design_runtime/qwen_voice_worker.py',
                        'voice_design_runtime/requirements.txt'):
              assert Path(asset).is_file(), f'Missing VoiceDesign release asset: {asset}'
          assert not list(Path('.').rglob('qwen_voice_design.local.json*'))
          print(f'Publishing Zura Nodes {version}')
          PY
      - name: Install test dependencies
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pillow requests soundfile av aiohttp opencv-python-headless safetensors
      - name: Install graph test DOM dependency outside the package
        run: npm install --prefix "$GITHUB_WORKSPACE/../ui-check" --ignore-scripts --no-audit --no-fund linkedom@0.18.13
      - name: Run regression checks
        run: |
          python -m unittest discover -s tests -p 'test_template_catalogue.py'
          node tests/test_audio_editor_connections.mjs
          node tests/test_dialogue_timing_connections.mjs
          node tests/test_dialogue_transcript.mjs
          node tests/test_dialogue_face_picker.mjs
          python -m unittest discover -s tests -p 'test_audio_dialogue.py'
          python -m unittest discover -s tests -p 'test_dialogue_edit.py'
          python -m compileall -q __init__.py klein_look.py multicam_v3.py multicam_v4_clean.py h3_single_angle.py idv2v_control.py
          python -m unittest discover -s tests -p 'test_v2_*.py'
          python -m unittest discover -s tests -p 'test_media_source_boundaries.py'
          python -m unittest discover -s tests -p 'test_studio_hardware.py'
          python -m compileall -q artist_studio wan_artist.py
          python -m unittest discover -s tests -p 'test_artist_studio.py'
          python -m unittest discover -s tests -p 'test_h3_head_swap.py'
          python -m unittest discover -s tests -p 'test_h3_head_studio.py'
          python -m unittest discover -s tests -p 'test_studio_availability.py'
          python -m unittest discover -s tests -p 'test_wan21_relight.py'
          python -m unittest discover -s tests -p 'test_studio_upload.py'
          python -m unittest discover -s tests -p 'test_h3_viewport_render.py'
          python -m unittest discover -s tests -p 'test_ltx25_viewport_plan.py'
          python -m unittest discover -s tests -p 'test_wan_viewport_mode.py'
          python -m unittest discover -s tests -p 'test_ltx25_native_plan.py'
          python -m unittest discover -s tests -p 'test_ltx25_studio_runtime.py'
          python -m unittest discover -s tests -p 'test_studio_opening.py'
          python -m unittest discover -s tests -p 'test_studio_appearance.py'
          python -m unittest discover -s tests -p 'test_cut_tracking.py'
          python -m unittest discover -s tests -p 'test_video_latent_data.py'
          python -m unittest discover -s tests -p 'test_studio_speech.py'
          python -m unittest discover -s tests -p 'test_studio_audio_modes.py'
          python -m unittest discover -s tests -p 'test_studio_selection_limits.py'
          python -m unittest discover -s tests -p 'test_studio_create_look.py'
          python -m unittest discover -s tests -p 'test_opening_subject.py'
          python -m unittest discover -s tests -p 'test_live_preview.py'
          python -m unittest discover -s tests -p 'test_file_cache.py'
          python -m unittest discover -s tests -p 'test_studio_runtime_efficiency.py'
          python -m unittest discover -s tests -p 'test_h3_camera.py'
          python -m unittest discover -s tests -p 'test_wan_animate2_studio.py'
          python -m unittest discover -s tests -p 'test_studio_mask_*.py'
          python -m unittest discover -s tests -p 'test_save_review_masks.py'
          python -m unittest discover -s tests -p 'test_studio_wan_fast_recipe.py'
          python -m unittest discover -s tests -p 'test_wan_graph_provenance.py'
          python -m unittest discover -s tests -p 'test_wan_speech.py'
          python -m unittest discover -s tests -p 'test_wan_cleanup.py'
          python -m unittest discover -s tests -p 'test_h3_reference_audio.py'
          python -m unittest discover -s tests -p 'test_h3_conditioning_cache.py'
          python -m unittest discover -s tests -p 'test_h3_text_cleanup_graph.py'
          python -m unittest discover -s tests -p 'test_h3_enhanced1080.py'
          python -m unittest discover -s tests -p 'test_wan_high_resolution.py'
          python -m unittest discover -s tests -p 'test_text_removal.py'
          python -m unittest discover -s tests -p 'test_text_background_repair_mask.py'
          python -m unittest discover -s tests -p 'test_klein_look.py'
          python -m unittest discover -s tests -p 'test_multicam_v3.py'
          python -m unittest discover -s tests -p 'test_short_take_duration.py'
          python -m unittest discover -s tests -p 'test_multicam_v4.py'
          python -m unittest discover -s tests -p 'test_multicam_v4_clean.py'
          python -m unittest discover -s tests -p 'test_h3_single_angle.py'
          python -m unittest discover -s tests -p 'test_camera_workflow_examples.py'
          python -m compileall -q longcat.py setup_longcat.py longcat_runtime
          python -m unittest discover -s tests -p 'test_longcat_*.py'
          python -m compileall -q qwen_voice_design.py setup_voice_design.py voice_design_runtime
          python -m unittest discover -s tests -p 'test_voice_design_*.py'
          node tests/test_chunk_progress_helpers.mjs
          node tests/test_media_picker_controls.mjs
          node tests/test_media_picker_requests.mjs
          node tests/test_multicam_widget_migration.mjs
          node tests/test_single_camera_gallery.mjs
          node tests/test_anyangle_english.mjs
          node tests/test_artist_graph.mjs
          node tests/test_wan_graph.mjs
          node tests/test_studio_upload.mjs
          node tests/test_studio_upload_dom.mjs
          node tests/test_studio_trim.mjs
          node tests/test_studio_create.mjs
          node tests/test_image_edit_recipes.mjs
          node tests/test_frame_video.mjs
          node tests/test_endpoint_ui.mjs
          node tests/test_wan_frame_video_recipes.mjs
          node tests/test_ltx_frame_video_recipes.mjs
          node tests/test_reference_video_recipes.mjs
          node tests/test_reference_video_ui.mjs
          node tests/test_studio_popovers.mjs
          node tests/test_studio_live_preview.mjs
          node tests/test_studio_length.mjs
          node tests/test_studio_layout.mjs
          node tests/test_studio_reset.mjs
      - name: Prepare qualified native Comfy CPU interfaces
        env:
          COMFYUI_ROOT: ${{ runner.temp }}/zura-native-comfy
        run: |
          git init "$COMFYUI_ROOT"
          git -C "$COMFYUI_ROOT" fetch --depth 1 https://github.com/Comfy-Org/ComfyUI.git 3c1b7a17fdf239d35ce98cc777756f572d089795
          git -C "$COMFYUI_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$COMFYUI_ROOT" rev-parse HEAD)" = 3c1b7a17fdf239d35ce98cc777756f572d089795
          # The native preparation parity tests import these genuine helpers,
          # not the pack's model-loading entry point. Keep its source outside
          # the public package alongside the qualified core checkout.
          NATIVE_POSE_ROOT="$COMFYUI_ROOT/custom_nodes/ComfyUI-WanAnimatePreprocess"
          git init "$NATIVE_POSE_ROOT"
          git -C "$NATIVE_POSE_ROOT" fetch --depth 1 https://github.com/kijai/ComfyUI-WanAnimatePreprocess.git 0e0b6a2a555625acf4d4aefb780e27d06937132f
          git -C "$NATIVE_POSE_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$NATIVE_POSE_ROOT" rev-parse HEAD)" = 0e0b6a2a555625acf4d4aefb780e27d06937132f
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['COMFYUI_ROOT']) / 'custom_nodes' / 'ComfyUI-WanAnimatePreprocess'
          # Match the three helper files from the qualified local v1.0.3 pack.
          expected = {
              'pose_utils/pose2d_utils.py': 'f278e3bbecdf615e957a510bf92151c7deb0c9079f92683a9b93d0a77493f87a',
              'pose_utils/human_visualization.py': '53fa92c12f21d2ea2b0c9fc46aab53c0d740cbf259a4e12e467649f2c95a70f0',
              'utils.py': 'b73640d6657c795ad932fc7e0d9aad58a6a466affe43cb1cd62f4e6db50d8265',
          }
          for name, digest in expected.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, f'Unqualified native helper: {name}'
          PY
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r "$COMFYUI_ROOT/requirements.txt"
          # Only CPU helper imports are required; no ONNX inference or GPU pack dependencies.
          python -m pip install matplotlib==3.11.0
      - name: Run isolated native data and bounded pipeline checks
        env:
          COMFYUI_ROOT: ${{ runner.temp }}/zura-native-comfy
          PYTHONPATH: ${{ runner.temp }}/zura-native-comfy
          CUDA_VISIBLE_DEVICES: ''
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import subprocess
          import sys
          # Native interfaces and tiny synthetic CPU fixtures only. Each leaf
          # gets its own interpreter so its Comfy stubs cannot leak to others.
          patterns = ('test_audio_split_editor.py', 'test_h3_camera.py',
                      'test_bounded_video_audio.py', 'test_wan_bounded_guard.py',
                      'test_wan_parts_graph.py', 'test_wan_preparation_parts.py',
                      'test_wan_preparation_windows.py', 'test_wan_preparation_merge.py',
                      'test_wan_streaming.py', 'test_wan_graph.py', 'test_wan_graph_integration.py',
                      'test_h3_control_data.py', 'test_h3_reference_data.py',
                      'test_h3_windows.py', 'test_h3_window_nodes.py')
          runner = """
          import comfy.cli_args
          comfy.cli_args.args.cpu = True
          import sys
          import unittest
          from unittest.mock import patch
          # Match CPU-only wheels when reproducing with a CUDA-enabled local
          # interpreter; optional native attention imports must not probe GPUs.
          with patch('torch.cuda.is_available', return_value=False):
              suite = unittest.defaultTestLoader.discover('tests', pattern=sys.argv[1])
              assert suite.countTestCases(), 'A required native regression suite is empty'
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          """
          for pattern in patterns:
              subprocess.run([sys.executable, '-c', runner, pattern], check=True)
          PY
      - name: Publish reviewed version
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          skip_checkout: 'true'
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
