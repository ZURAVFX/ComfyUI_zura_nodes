name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check package metadata, assets and documentation
        run: |
          python tools/check_package.py
          python tools/check_docs.py
      - name: Install CPU libraries for optional-runtime boundary tests
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install soundfile
      - name: Check portable templates and optional runtime boundaries
        run: |
          python -m unittest discover -s tests -p 'test_template_catalogue.py'
          python -m unittest discover -s tests -p 'test_longcat_release.py'
          python -m unittest discover -s tests -p 'test_voice_design_release.py'
          python -m unittest discover -s tests -p 'test_browser_defaults.py'

  comfylink:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install CPU media test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pillow aiohttp av OpenImageIO
      - name: Check local bridge, exact frames and real EXR precision
        run: |
          python -m unittest discover -s tests -p 'test_comfylink_adapter.py'
          python -m unittest discover -s tests -p 'test_comfylink_nodes.py'
          python -m unittest discover -s tests -p 'test_comfylink_float_io.py'
          python -m unittest discover -s tests -p 'test_comfylink_float_preflight.py'
          python -m unittest discover -s tests -p 'test_comfylink_ltx_colour.py'
          python -m unittest discover -s tests -p 'test_comfylink_frame_contract.py'
          python -m unittest discover -s tests -p 'test_comfylink_studio.py'
          python -m unittest discover -s tests -p 'test_comfylink_studio_instance.py'
          python -m unittest discover -s tests -p 'test_hdr_exr_precision.py'
          node tests/test_studio_ae_bridge.mjs
          node tests/test_studio_ae_frames.mjs
          node tests/test_studio_exr_precision.mjs

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/studio-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/studio-ui/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Check committed runtime bundles match the sources
        run: git diff --exit-code -- ../../web/vendor/
