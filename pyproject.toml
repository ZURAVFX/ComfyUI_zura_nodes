[project]
name = "comfyui-zura-nodes"
version = "1.3.1"
description = "Zura Studio for LTX, MiniMax H3, Wan and optional Seedance, plus artist controls for video loading, performer masking, multicam planning, H3 rendering, Klein scene edits, Wan IDV2V relighting, local LongCat speech, and prompt-driven Qwen VoiceDesign."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.32.2",
    "yt-dlp[default]>=2026.8.19",
    "ultralytics>=8.4.66",
    "face-alignment==1.4.1",
    "soundfile>=0.12.0",
    "av>=14.0",
    "aiohttp>=3.11",
    "Pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/ZURAVFX/ComfyUI_zura_nodes"
Issues = "https://github.com/ZURAVFX/ComfyUI_zura_nodes/issues"

[tool.comfy]
PublisherId = "zuravfx"
DisplayName = "Zura Nodes"
