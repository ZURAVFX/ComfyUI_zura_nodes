name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check package metadata, assets and documentation
        run: |
          python tools/check_package.py
          python tools/check_docs.py
      - name: Install CPU libraries for optional-runtime boundary tests
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install soundfile
      - name: Check portable templates and optional runtime boundaries
        run: |
          python -m unittest discover -s tests -p 'test_template_catalogue.py'
          python -m unittest discover -s tests -p 'test_longcat_release.py'
          python -m unittest discover -s tests -p 'test_voice_design_release.py'
          python -m unittest discover -s tests -p 'test_browser_defaults.py'

  comfylink:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install CPU media test dependencies
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if ! sudo timeout --kill-after=10s 120s apt-get \
              -o APT::Update::Error-Mode=any \
              -o Acquire::Retries=0 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 update; then
              # Ubuntu's primary hosts can share a DNS outage. The fallback
              # retains the existing Ubuntu signature keyring and source fields.
              sudo python tools/ci_ubuntu_mirror.py
              sudo timeout --kill-after=10s 120s apt-get \
                -o APT::Update::Error-Mode=any \
                -o Acquire::Retries=0 \
                -o Acquire::http::Timeout=15 \
                -o Acquire::https::Timeout=15 update
            fi
            sudo timeout --kill-after=10s 120s apt-get \
              -o Acquire::Retries=0 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pillow requests soundfile aiohttp av opencv-python-headless safetensors OpenImageIO opencolorio psutil huggingface_hub
          npm install --prefix "$GITHUB_WORKSPACE/../ui-check" --ignore-scripts --no-audit --no-fund linkedom@0.18.13
      - name: Check local bridge, exact frames and real EXR precision
        run: |
          python -m unittest discover -s tests -p 'test_comfylink_adapter.py'
          python -m unittest discover -s tests -p 'test_comfylink_nodes.py'
          python -m unittest discover -s tests -p 'test_comfylink_float_io.py'
          python -m unittest discover -s tests -p 'test_comfylink_float_staging.py'
          python -m unittest discover -s tests -p 'test_comfylink_float_preflight.py'
          python -m unittest discover -s tests -p 'test_sdr10_rational.py'
          python -m unittest discover -s tests -p 'test_comfylink_ltx_colour.py'
          python -m unittest discover -s tests -p 'test_comfylink_frame_contract.py'
          python -m unittest discover -s tests -p 'test_comfylink_studio.py'
          python -m unittest discover -s tests -p 'test_comfylink_studio_instance.py'
          python -m unittest discover -s tests -p 'test_comfylink_studio_host.py'
          python -m unittest discover -s tests -p 'test_studio_media_import.py'
          python -m unittest discover -s tests -p 'test_prores444.py'
          python -m unittest discover -s tests -p 'test_hdr_prores.py' -k test_sdr_video_node
          python -m unittest discover -s tests -p 'test_relight_source_timing.py'
          python -m unittest discover -s tests -p 'test_hdr_exr_precision.py'
          python -m unittest discover -s tests -p 'test_character_swap_masks.py'
          node tests/test_switch_x_native.mjs
          node tests/test_studio_create.mjs
          python tests/test_switch_x.py
          python tests/test_switch_x_structure.py
          python -m unittest discover -s tests -p 'test_studio_openjutsu.py'
          python -m unittest discover -s tests -p 'test_comfylink_movie_rate.py'
          node tests/test_studio_brush_size.mjs
          node tests/test_studio_workflow_progress.mjs
          node tests/test_studio_result_ownership.mjs
          node tests/test_studio_plate_inline.mjs
          node tests/test_studio_plate_compact.mjs
          node tests/test_studio_paint_vfx_ui.mjs
          node tests/test_studio_ae_bridge.mjs
          node tests/test_studio_ae_display.mjs
          node tests/test_studio_desktop_handoff.mjs
          node tests/test_studio_desktop_restore.mjs
          node tests/test_studio_ae_frames.mjs
          node tests/test_studio_ae_normal_clip.mjs
          node tests/test_studio_ae_source_rebind.mjs
          node tests/test_studio_exr_precision.mjs
          node tests/test_studio_host_adapters.mjs
          node tests/test_studio_ae_probe.mjs
          node tests/test_studio_host_version_build.mjs

      - name: Check Studio transfer, display and edit placement
        run: |
          node tests/test_studio_media_import.mjs
          node tests/test_studio_delivery_controls.mjs
          node tests/test_studio_no_colour_transforms.mjs
          node tests/test_studio_image_area_submit.mjs
          node tests/test_studio_image_area_mask_size.mjs
          node tests/test_studio_plate_prompts.mjs
          node tests/test_image_edit_placement.mjs
          node tests/test_paintout_style_ready.mjs

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/studio-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/studio-ui/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Check committed runtime bundles match the sources
        run: git diff --exit-code -- ../../web/vendor/ ../../web/studio_host_manifest.json ../../web/studio_host_version.js
