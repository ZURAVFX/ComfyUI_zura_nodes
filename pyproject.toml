[project]
name = "comfyui-zura-nodes"
version = "1.3.24"
description = "ComfyUI Zura Studio for character performance with LTX 2.5, MiniMax H3 and Wan, H3 head replacement and viewport-to-final workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.32.2",
    "yt-dlp[default]>=2026.8.19",
    "ultralytics>=8.4.66",
    "face-alignment==1.4.1",
    "soundfile>=0.12.0",
    "av>=14.0",
    "aiohttp>=3.11",
    "Pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/ZURAVFX/ComfyUI_zura_nodes"
Issues = "https://github.com/ZURAVFX/ComfyUI_zura_nodes/issues"

[tool.comfy]
PublisherId = "zuravfx"
DisplayName = "Zura Nodes"
