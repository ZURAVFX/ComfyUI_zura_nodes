name: Publish to Comfy Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ZURAVFX/ComfyUI_zura_nodes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check release version and package assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/check_package.py
      - name: Install test dependencies
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pillow requests soundfile av aiohttp opencv-python-headless safetensors OpenImageIO
      - name: Install graph test DOM dependency outside the package
        run: npm install --prefix "$GITHUB_WORKSPACE/../ui-check" --ignore-scripts --no-audit --no-fund linkedom@0.18.13
      - name: Run regression checks
        run: |
          python -m unittest discover -s tests -p 'test_template_catalogue.py'
          python -m compileall -q paintout
          python -m unittest discover -s tests -p 'test_paintout_*.py'
          node tests/test_paintout_picker.mjs
          node tests/test_paintout_recipes.mjs
          node tests/test_paintout_ui.mjs
          node tests/test_audio_editor_connections.mjs
          node tests/test_dialogue_timing_connections.mjs
          node tests/test_dialogue_transcript.mjs
          node tests/test_dialogue_face_picker.mjs
          python -m unittest discover -s tests -p 'test_audio_dialogue.py'
          python -m unittest discover -s tests -p 'test_dialogue_edit.py'
          python -m compileall -q __init__.py klein_look.py multicam_v3.py multicam_v4_clean.py h3_single_angle.py idv2v_control.py
          python -m unittest discover -s tests -p 'test_v2_*.py'
          python -m unittest discover -s tests -p 'test_media_source_boundaries.py'
          python -m unittest discover -s tests -p 'test_studio_hardware.py'
          python -m compileall -q artist_studio wan_artist.py
          python -m unittest discover -s tests -p 'test_artist_studio.py'
          python -m unittest discover -s tests -p 'test_h3_head_swap.py'
          python -m unittest discover -s tests -p 'test_h3_head_studio.py'
          python -m unittest discover -s tests -p 'test_studio_availability.py'
          python -m unittest discover -s tests -p 'test_wan21_relight.py'
          python -m unittest discover -s tests -p 'test_studio_upload.py'
          python -m unittest discover -s tests -p 'test_h3_viewport_render.py'
          python -m unittest discover -s tests -p 'test_ltx25_viewport_plan.py'
          python -m unittest discover -s tests -p 'test_wan_viewport_mode.py'
          python -m unittest discover -s tests -p 'test_ltx25_native_plan.py'
          python -m unittest discover -s tests -p 'test_ltx25_studio_runtime.py'
          python -m unittest discover -s tests -p 'test_studio_opening.py'
          python -m unittest discover -s tests -p 'test_studio_appearance.py'
          python -m unittest discover -s tests -p 'test_cut_tracking.py'
          python -m unittest discover -s tests -p 'test_video_latent_data.py'
          python -m unittest discover -s tests -p 'test_studio_speech.py'
          python -m unittest discover -s tests -p 'test_studio_audio_modes.py'
          python -m unittest discover -s tests -p 'test_studio_selection_limits.py'
          python -m unittest discover -s tests -p 'test_studio_create_look.py'
          python -m unittest discover -s tests -p 'test_opening_subject.py'
          python -m unittest discover -s tests -p 'test_live_preview.py'
          python -m unittest discover -s tests -p 'test_file_cache.py'
          python -m unittest discover -s tests -p 'test_studio_runtime_efficiency.py'
          python -m unittest discover -s tests -p 'test_h3_camera.py'
          python -m unittest discover -s tests -p 'test_wan_animate2_studio.py'
          python -m unittest discover -s tests -p 'test_studio_mask_*.py'
          python -m unittest discover -s tests -p 'test_save_review_masks.py'
          python -m unittest discover -s tests -p 'test_studio_wan_fast_recipe.py'
          python -m unittest discover -s tests -p 'test_wan_graph_provenance.py'
          python -m unittest discover -s tests -p 'test_wan_speech.py'
          python -m unittest discover -s tests -p 'test_wan_cleanup.py'
          python -m unittest discover -s tests -p 'test_h3_reference_audio.py'
          python -m unittest discover -s tests -p 'test_h3_conditioning_cache.py'
          python -m unittest discover -s tests -p 'test_h3_text_cleanup_graph.py'
          python -m unittest discover -s tests -p 'test_h3_enhanced1080.py'
          python -m unittest discover -s tests -p 'test_wan_high_resolution.py'
          python -m unittest discover -s tests -p 'test_text_removal.py'
          python -m unittest discover -s tests -p 'test_text_background_repair_mask.py'
          python -m unittest discover -s tests -p 'test_klein_look.py'
          python -m unittest discover -s tests -p 'test_multicam_v3.py'
          python -m unittest discover -s tests -p 'test_short_take_duration.py'
          python -m unittest discover -s tests -p 'test_multicam_v4.py'
          python -m unittest discover -s tests -p 'test_multicam_v4_clean.py'
          python -m unittest discover -s tests -p 'test_h3_single_angle.py'
          python -m unittest discover -s tests -p 'test_camera_workflow_examples.py'
          python -m compileall -q longcat.py setup_longcat.py longcat_runtime
          python -m unittest discover -s tests -p 'test_longcat_*.py'
          python -m compileall -q qwen_voice_design.py setup_voice_design.py voice_design_runtime
          python -m unittest discover -s tests -p 'test_voice_design_*.py'
          node tests/test_chunk_progress_helpers.mjs
          node tests/test_media_picker_controls.mjs
          node tests/test_media_picker_requests.mjs
          node tests/test_multicam_widget_migration.mjs
          node tests/test_single_camera_gallery.mjs
          node tests/test_anyangle_english.mjs
          node tests/test_artist_graph.mjs
          node tests/test_wan_graph.mjs
          node tests/test_studio_upload.mjs
          node tests/test_studio_upload_dom.mjs
          node tests/test_studio_trim.mjs
          node tests/test_studio_create.mjs
          node tests/test_image_edit_recipes.mjs
          node tests/test_frame_video.mjs
          node tests/test_endpoint_ui.mjs
          node tests/test_wan_frame_video_recipes.mjs
          node tests/test_ltx_frame_video_recipes.mjs
          node tests/test_reference_video_recipes.mjs
          node tests/test_reference_video_ui.mjs
          node tests/test_studio_popovers.mjs
          node tests/test_studio_live_preview.mjs
          node tests/test_studio_length.mjs
          node tests/test_studio_layout.mjs
          node tests/test_studio_reset.mjs
      - name: Prepare qualified native Comfy CPU interfaces
        env:
          COMFYUI_ROOT: ${{ runner.temp }}/zura-native-comfy
        run: |
          git init "$COMFYUI_ROOT"
          git -C "$COMFYUI_ROOT" fetch --depth 1 https://github.com/Comfy-Org/ComfyUI.git 3c1b7a17fdf239d35ce98cc777756f572d089795
          git -C "$COMFYUI_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$COMFYUI_ROOT" rev-parse HEAD)" = 3c1b7a17fdf239d35ce98cc777756f572d089795
          # The native preparation parity tests import these genuine helpers,
          # not the pack's model-loading entry point. Keep its source outside
          # the public package alongside the qualified core checkout.
          NATIVE_POSE_ROOT="$COMFYUI_ROOT/custom_nodes/ComfyUI-WanAnimatePreprocess"
          git init "$NATIVE_POSE_ROOT"
          git -C "$NATIVE_POSE_ROOT" fetch --depth 1 https://github.com/kijai/ComfyUI-WanAnimatePreprocess.git 0e0b6a2a555625acf4d4aefb780e27d06937132f
          git -C "$NATIVE_POSE_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$NATIVE_POSE_ROOT" rev-parse HEAD)" = 0e0b6a2a555625acf4d4aefb780e27d06937132f
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['COMFYUI_ROOT']) / 'custom_nodes' / 'ComfyUI-WanAnimatePreprocess'
          # Match the three helper files from the qualified local v1.0.3 pack.
          expected = {
              'pose_utils/pose2d_utils.py': 'f278e3bbecdf615e957a510bf92151c7deb0c9079f92683a9b93d0a77493f87a',
              'pose_utils/human_visualization.py': '53fa92c12f21d2ea2b0c9fc46aab53c0d740cbf259a4e12e467649f2c95a70f0',
              'utils.py': 'b73640d6657c795ad932fc7e0d9aad58a6a466affe43cb1cd62f4e6db50d8265',
          }
          for name, digest in expected.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, f'Unqualified native helper: {name}'
          PY
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r "$COMFYUI_ROOT/requirements.txt"
          # Only CPU helper imports are required; no ONNX inference or GPU pack dependencies.
          python -m pip install matplotlib==3.11.0
      - name: Run isolated native data and bounded pipeline checks
        env:
          COMFYUI_ROOT: ${{ runner.temp }}/zura-native-comfy
          PYTHONPATH: ${{ runner.temp }}/zura-native-comfy
          CUDA_VISIBLE_DEVICES: ''
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import subprocess
          import sys
          # Native interfaces and tiny synthetic CPU fixtures only. Each leaf
          # gets its own interpreter so its Comfy stubs cannot leak to others.
          patterns = ('test_audio_split_editor.py', 'test_h3_camera.py',
                      'test_bounded_video_audio.py', 'test_wan_bounded_guard.py',
                      'test_wan_parts_graph.py', 'test_wan_preparation_parts.py',
                      'test_wan_preparation_windows.py', 'test_wan_preparation_merge.py',
                      'test_wan_streaming.py', 'test_wan_graph.py', 'test_wan_graph_integration.py',
                      'test_h3_control_data.py', 'test_h3_reference_data.py',
                      'test_h3_windows.py', 'test_h3_window_nodes.py')
          runner = """
          import comfy.cli_args
          comfy.cli_args.args.cpu = True
          import sys
          import unittest
          from unittest.mock import patch
          # Match CPU-only wheels when reproducing with a CUDA-enabled local
          # interpreter; optional native attention imports must not probe GPUs.
          with patch('torch.cuda.is_available', return_value=False):
              suite = unittest.defaultTestLoader.discover('tests', pattern=sys.argv[1])
              assert suite.countTestCases(), 'A required native regression suite is empty'
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          """
          for pattern in patterns:
              subprocess.run([sys.executable, '-c', runner, pattern], check=True)
          PY
      - name: Publish reviewed version
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          skip_checkout: 'true'
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
